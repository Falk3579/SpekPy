name: Tests

on:
  push:
    branches:
      - "modernize/**"
  pull_request:
    branches:
      - MuEn_Data
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-python v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      # astral-sh/setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create isolated environment
        run: uv venv --python "${{ matrix.python-version }}"

      - name: Install project and pytest
        run: uv pip install --python .venv/bin/python -e . "pytest>=9,<10"

      - name: Run numerical regression suite
        run: .venv/bin/python -m pytest -q
