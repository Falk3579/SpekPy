[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "spekpy"
dynamic = ["version"]
description = "A Python software toolkit for modelling the x-ray spectra from x-ray tubes"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Gavin Poludniowski", email = "gpoludniowski@gmail.com" },
    { name = "Robert Bujila" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]
license = "MIT"
license-files = ["license.txt"]

[project.urls]
Homepage = "https://bitbucket.org/spekpy/spekpy_release"
Source = "https://github.com/Falk3579/SpekPy"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "pyrefly",
]

# Keep the library and distribution version in one place.
[tool.hatch.version]
path = "spekpy/__init__.py"

# Package all SpekPy modules and bundled scientific data, including .dat/.npz
# tables, .comp material definitions, and .state reference spectra.
[tool.hatch.build.targets.wheel]
packages = ["spekpy"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# Preserve established numerical and exported-text formatting.
ignore = ["UP031"]
